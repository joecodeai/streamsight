apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: streamsight-api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamsight-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamsight-api
  template:
    metadata:
      labels:
        app: streamsight-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics/
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/joecodeai/streamsight-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: streamsight-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
