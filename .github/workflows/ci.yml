name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[api,onnx,milvus,dev]"
      - name: Fetch re-id model for embedder tests
        run: |
          mkdir -p models
          curl -sSfL -o models/osnet_x0_25_msmt17.onnx \
            https://huggingface.co/kornia/osnet/resolve/main/osnet_x0_25_msmt17.onnx
      - run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: streamsight-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
