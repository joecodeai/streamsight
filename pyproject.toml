[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamsight"
version = "0.1.0"
description = "Real-time multi-camera video analytics: detection, tracking, cross-camera re-identification and pose on GPU."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joel Thomas" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu>=1.18"]
openvino = ["openvino>=2024.0"]
milvus = ["pymilvus>=2.4"]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
export = ["ultralytics>=8.3", "onnx>=1.16", "onnxslim>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
streamsight-pipeline = "streamsight.pipeline.cli:main"
streamsight-api = "streamsight.api.main:run"
streamsight-bench = "streamsight.bench:main"
streamsight-deepstream = "streamsight.deepstream.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"streamsight.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # line length is enforced by ruff format
